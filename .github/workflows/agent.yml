name: Agent run
run-name: "agent ${{ inputs.item }} ${{ inputs.repo }}"

# One agent CLI working one board item as the unprivileged agent user,
# with its condensed transcript in this job's log and the full one in
# artifacts. The inputs, artifacts and summary.json follow
# docs/devspace-agent-runs.md in cgwalters-bot/homegit; bot-runs there
# dispatches and reads these runs. Inference is a local mock for now
# (agent/mock-model.py), so no credentials are involved.
on:
  workflow_dispatch:
    inputs:
      item:
        description: "Board item id (PVTI_...)"
        type: string
        required: true
      repo:
        description: "Target repository, OWNER/REPO"
        type: string
        required: true
      base:
        description: "Base ref of the target repository"
        type: string
        default: main
      agent:
        description: "Agent CLI"
        type: choice
        options: ["claude", "opencode"]
        default: claude
      model:
        description: "Model name (empty: the agent's default)"
        type: string
        default: ""
      cores:
        description: "Runner CPU cores"
        type: choice
        options: ["4", "16", "64"]
        default: "4"
      timeout:
        description: "Minutes the agent may run (at most 330)"
        type: string
        default: "120"
      budget:
        description: "Spend cap in AIC (1 AIC = $0.01)"
        type: string
        default: "500"
      workflow:
        description: "What the item wants"
        type: choice
        options: ["branch", "analysis"]
        default: branch
      brief:
        description: "The task text (public: no private data)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: agent-${{ inputs.item }}
  cancel-in-progress: false

env:
  # The only inference there is so far (a local mock).
  INFERENCE: mock
  PROXY_URL: http://127.0.0.1:3128
  PROXY_LOG: /var/log/tinyproxy/agent.log

jobs:
  agent:
    name: Agent
    # AGENT_RUNS_ON overrides the RHEL runners, e.g. with ubuntu-24.04 on a
    # fork that lacks them (a mock run needs nothing RHEL-specific).
    runs-on: ${{ vars.AGENT_RUNS_ON || fromJSON('{"4":"rhel10-x86_64-4c-16g","16":"rhel10-x86_64-16c-64g","64":"rhel10-x86_64-64c-256g"}')[inputs.cores] }}
    timeout-minutes: 360
    steps:
      # Anyone with write access can dispatch, and every run costs money.
      # triggering_actor is who started this attempt (a re-run's too).
      # TODO: the real gate should be an environment with required
      # reviewers, once runs use credentials.
      - name: Check the actor
        shell: bash
        env:
          ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          case "$ACTOR" in
            cgwalters|cgwalters-bot) ;;
            *) echo "::error::agent runs are only for cgwalters and cgwalters-bot, not $ACTOR"; exit 1 ;;
          esac

      - name: Check the inputs
        shell: bash
        env:
          TIMEOUT: ${{ inputs.timeout }}
          BUDGET: ${{ inputs.budget }}
        run: |
          set -euo pipefail
          if ! [[ "$TIMEOUT" =~ ^[1-9][0-9]{0,2}$ ]] || (( TIMEOUT > 330 )); then
            echo "::error::timeout must be 1-330 minutes, not '$TIMEOUT'"
            exit 1
          fi
          if ! [[ "$BUDGET" =~ ^(0|[1-9][0-9]{0,5})(\.[0-9]+)?$ ]]; then
            echo "::error::budget must be a number of AIC, not '$BUDGET'"
            exit 1
          fi

      - name: Check out agent configuration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install prerequisites
        shell: bash
        run: |
          set -euo pipefail
          packages=(git jq curl python3 zstd nftables tinyproxy podman)
          if command -v dnf >/dev/null; then
            sudo dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm
            sudo dnf install -y "${packages[@]}" nodejs npm
          else
            sudo apt-get update -q && sudo apt-get install -y -q "${packages[@]}"
          fi
          grep -vE '^\s*(#|$)' npm.txt | xargs -r sudo npm install -g --no-audit --no-fund

      # Logs and transcripts are public, so private repositories are refused
      # (as they are by bot-runs dispatch), before anything is cloned.
      - name: Check that the target repository is public
        shell: bash
        env:
          REPO: ${{ inputs.repo }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/public-repo.mjs "$REPO"

      - name: Create the unprivileged agent user
        shell: bash
        run: sudo node scripts/setup-agent-user.mjs

      - name: Limit the agent user's network access
        shell: bash
        run: sudo node scripts/agent-egress.mjs agent/egress-allowlist.txt "$PROXY_LOG"

      - name: Check the agent user's isolation
        shell: bash
        run: node scripts/agent-isolation-check.mjs "$PROXY_URL" https://github.com/ https://example.com/

      - name: Run the agent
        id: agent
        shell: bash
        timeout-minutes: 340
        env:
          ITEM: ${{ inputs.item }}
          REPO: ${{ inputs.repo }}
          BASE: ${{ inputs.base }}
          AGENT: ${{ inputs.agent }}
          MODEL: ${{ inputs.model }}
          CORES: ${{ inputs.cores }}
          TIMEOUT_MINUTES: ${{ inputs.timeout }}
          BUDGET: ${{ inputs.budget }}
          WORKFLOW: ${{ inputs.workflow }}
          BRIEF: ${{ inputs.brief }}
          OUT: ${{ runner.temp }}/agent
        run: node agent/run.mjs

      # Nothing is uploaded unless this passes, even when the agent failed:
      # the target is still public, and nothing secret-shaped is left.
      - name: Check the uploads
        id: uploads
        if: ${{ !cancelled() }}
        shell: bash
        env:
          REPO: ${{ inputs.repo }}
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}/agent
        run: node scripts/check-uploads.mjs "$OUT" "$REPO"

      - name: Upload the run summary
        if: ${{ !cancelled() && steps.uploads.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-run
          path: ${{ runner.temp }}/agent/run/
          retention-days: 90
          if-no-files-found: error

      - name: Upload the transcript
        if: ${{ !cancelled() && steps.uploads.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-transcript
          path: ${{ runner.temp }}/agent/transcript.tar.zst
          retention-days: 30
          if-no-files-found: error
